  recovery-sent: "&7Код восстановления отправлен на &f%email%&7.\n&7Сброс пароля: &f/email recovery <код> <новыйПароль> <новыйПароль>"
  recovery-usage: "&7Использование: &f/email recovery <код> <новыйПароль> <новыйПароль>"
  cooldown: "&7Подождите немного, прежде чем запрашивать новое письмо."
  send-failed: "&7Не удалось отправить письмо. Обратитесь к администратору."
  recovered: "&fПароль успешно сброшен!"

premium:
  help: "&7Премиум-режим:\n&f/premium &7- автоматический вход с купленным, подтверждённым Mojang аккаунтом (без пароля)\n&7Работает только если сервер или его прокси проверяет сессии Mojang (online-mode).\n&7Ваш пароль сохраняется - отключить можно в любой момент: &f/freemium"
  checking: "&7Проверяем ваш аккаунт Mojang..."
