# ║                     Login+  -  messages_ru.yml                         ║
# ║   Все тексты, которые видят игроки. Строгая палитра из двух цветов:    ║
# ║   &7 = серый (основной текст)   &f = белый (выделение)                 ║
# ║   \n внутри сообщения создаёт новую строку.                            ║
# ║   Язык переключается в config.yml:  language: "en" / "ru"              ║

prefix: "&7[&fLogin+&7] "

register:
  prompt: "&7Добро пожаловать! Создайте аккаунт: &f/register <пароль> <пароль>"
  reminder: "&7Пожалуйста, зарегистрируйтесь: &f/register <пароль> <пароль>"
  usage: "&7Использование: &f/register <пароль> <повторПароля>"
  mismatch: "&7Введённые пароли &fне совпадают&7."
  too-short: "&7Пароль слишком короткий - минимум &f%min% &7символов."
  too-long: "&7Пароль слишком длинный - максимум &f%max% &7символов."
  too-weak: "&7Этот пароль &fслишком легко угадать&7. Придумайте что-то надёжнее!"
  need-uppercase: "&7В пароле должна быть хотя бы &fодна заглавная буква&7."
  need-symbol: "&7В пароле должен быть хотя бы &fодин спецсимвол &7(например ! ? #)."
  too-simple: "&7Пароль содержит &fповторы или последовательности &7(например 0000 или 1234)."
  already-registered: "&7У вас уже есть аккаунт. Используйте &f/login <пароль>"
  ip-limit: "&7С вашего IP-адреса уже зарегистрировано слишком много аккаунтов."
  success: "&fАккаунт создан! &7Вы вошли в игру. Совет: подключите бесплатную 2FA: &f/2fa setup"

login:
  countdown: "&fДо отключения: &e%seconds% &fсек."
  password-ok: "&aПароль верный!"
  prompt: "&7С возвращением! Войдите: &f/login <пароль>"
  reminder: "&7Пожалуйста, войдите: &f/login <пароль>"
  usage: "&7Использование: &f/login <пароль>"
  success: "&fВход выполнен. &7Приятной игры!"
  wrong-password: "&fНеверный пароль! &7(осталось попыток: %left%)"
  not-registered: "&7У вас ещё нет аккаунта. Используйте &f/register <пароль> <пароль>"
  already-logged-in: "&7Вы уже вошли."

logout:
  success: "&7Вы вышли из аккаунта. Сессия закрыта - используйте &f/login&7, чтобы продолжить игру."

session:
  resumed: "&fСессия восстановлена &7- с возвращением! (вход не нужен)"
  resumed-needs-2fa: "&fСессия восстановлена &7- с возвращением!"

changepassword:
  usage: "&7Использование: &f/changepassword <старыйПароль> <новыйПароль>"
  wrong-password: "&7Текущий пароль &fневерен&7."
  success: "&fПароль успешно изменён."

unregister:
  usage: "&7Использование: &f/unregister <пароль>"

twofactor:
  usage: "&7Команды 2FA:\n&f/2fa setup totp &7- Google Authenticator (офлайн-приложение)\n&f/2fa setup discord <ваш Discord ID> &7- коды в ЛС Discord\n&f/2fa setup telegram &7- коды в Telegram\n&f/2fa confirm <код> &7- завершить настройку\n&f/2fa backup <пароль> &7- новый набор одноразовых резервных кодов\n&f/2fa disable <пароль> &7- отключить 2FA\n&f/2fa status &7- показать текущий способ"
  disable-usage: "&7Использование: &f/2fa disable <пароль>"
  method-disabled: "&7Этот способ 2FA отключён на сервере."
  discord-usage: "&7Использование: &f/2fa setup discord <ваш Discord ID>\n&7Discord - Настройки - Расширенные - включите режим разработчика,\n&7затем нажмите ПКМ по своему имени и 'Копировать ID пользователя'."
  sending: "&7Отправляем код подтверждения..."
  discord-code-sent: "&fКод отправлен в ЛС Discord! &7Завершите командой &f/2fa confirm <код>"
  discord-dm-failed: "&7Не удалось написать вам в Discord. Проверьте ID, убедитесь, что у вас с ботом есть общий сервер и разрешены ЛС."
  telegram-instructions: "&7Откройте Telegram, найдите &f@%bot% &7и отправьте ему этот код:\n&f&l%code%\n&7Привязка завершится автоматически."
  totp-setup: "&7Настройка Google Authenticator начата!\n&7Секретный ключ: &f%secret%\n&7Добавьте его в приложение-аутентификатор (или отсканируйте QR-карту),\n&7затем завершите: &f/2fa confirm <код из приложения>"
  totp-map: "&7QR-карта помещена вам в руку. &fДержите её и смотрите на неё &7- на карте появится QR-код. Отсканируйте его приложением Google Authenticator (заранее ничего настраивать не нужно), затем введите &f/2fa confirm <код>&7. Карта исчезнет автоматически."
  nothing-to-confirm: "&7Подтверждать нечего. Начните с &f/2fa setup <способ>"
  wrong-code: "&7Этот код &fневерен&7."
  enabled: "&f2FA через %method% &7теперь защищает ваш аккаунт!"
  not-enabled: "&7У вас не включена 2FA."
  wrong-password: "&fНеверный пароль."
  disabled: "&72FA &fотключена &7для вашего аккаунта."
  status: "&7Ваш способ 2FA: &f%method%"
  prompt-totp: "&fВведите код из приложения: &e/2fa <код>"
  prompt-code: "&fКод отправлен через &e%method%&f. Введите: &e/2fa <код>"
  prompt-generic: "&7Почти готово - введите код 2FA: &f/2fa <код> &7(или /2fa resend)"
  code-sent: "&7Код входа отправлен через &f%method%&7."
  code-send-failed: "&7Не удалось доставить код. Попробуйте &f/2fa resend &7или обратитесь к администратору."
  resend-cooldown: "&7Подождите немного, прежде чем запрашивать новый код."
  backup-usage: "&7Использование: &f/2fa backup <пароль>"
  backup-codes: "&7Ваши одноразовые резервные коды:\n&f%codes%\n&7Если вы потеряете устройство 2FA, любой из них сработает как\n&7обычный код: &f/2fa XXXX-XXXX-XXXX&7. Каждый код работает &fодин раз&7.\n&7Сохраните их сейчас - они показываются только один раз!"
  backup-used: "&fРезервный код принят! &7Осталось кодов: &f%left%&7. Потеряли устройство? Настройте 2FA заново: &f/2fa setup"
  status-backup: "&7Осталось резервных кодов: &f%left% &7- новый набор: &f/2fa backup <пароль>"
  backup-outdated: "&7Ваши резервные коды в &fстаром, менее защищённом формате&7. Они ещё работают, но лучше заменить: &f/2fa backup <пароль>"
  required: "&7На этом сервере &f2FA обязательна для персонала&7. Выберите способ:\n&f/2fa setup totp &7- Google Authenticator (офлайн-приложение)\n&f/2fa setup discord <ваш Discord ID> &7- коды в ЛС Discord\n&f/2fa setup telegram &7- коды в Telegram\n&7Играть можно сразу после включения 2FA."
  required-reminder: "&7Сначала настройте 2FA: &f/2fa setup <способ>"
  required-done: "&fСпасибо! &7Ваш аккаунт защищён - приятной игры!"
  not-awaiting: "&7Сейчас от вас не ожидается код 2FA."
  reminder: "&7Введите код 2FA: &f/2fa <код>"

protection:
  chat-blocked: "&7Войдите в аккаунт, прежде чем писать в чат."
  command-blocked: "&7Войдите в аккаунт, прежде чем использовать команды."

email:
  usage: "&7Команды e-mail:\n&f/email set <адрес> &7- привязать почту для восстановления\n&f/email confirm <код> &7- завершить привязку\n&f/email remove <пароль> &7- отвязать почту\n&f/email recovery &7- сбросить забытый пароль"
  invalid: "&7Это не похоже на &fкорректный e-mail адрес&7."
  disabled: "&7Восстановление по e-mail &fотключено &7на этом сервере."
  sending: "&7Отправляем письмо..."
