  discord-setup-code: "[%server%] Код подтверждения настройки 2FA: %code%"
  telegram-linked: "[%server%] Этот Telegram теперь привязан к аккаунту Minecraft '%player%'. Сюда будут приходить коды входа и оповещения безопасности."
