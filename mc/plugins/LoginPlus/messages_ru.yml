  disabled-by-server: "&7Премиум-режим отключён на этом сервере."
  not-verified: "&7Ваше подключение &fне подтверждено Mojang&7, поэтому премиум-режим включить нельзя.\n&7Нужен online-mode сервер или online-mode прокси с IP-forwarding."
  connection-not-verified: "&7Сервер не может &fдоказать&7, что подключения проверены Mojang, поэтому вход без пароля запрещён.\n&7Нужен online-mode или прокси Velocity с modern forwarding.\n&7(Старый BungeeCord-forwarding не подписан и его можно подделать.)"
  no-mojang-account: "&7Имя &f%name% &7не принадлежит купленному аккаунту Mojang."
  mojang-mismatch: "&7Ваш профиль не совпадает с аккаунтом Mojang с именем &f%name%&7."
  verify-failed: "&7Не удалось связаться с Mojang для проверки. Попробуйте позже."
  auto-login: "&fПремиум-аккаунт подтверждён &7- вход выполнен автоматически."

freemium:
