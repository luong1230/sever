# Заголовки на экране (префикс к ним не добавляется).
# MOTD после входа. Одна строка списка = одна строка в чате.
# В конце строки можно поставить действие по клику:
#   [url:https://...]  - открыть ссылку
#   [run:/menu]        - выполнить команду
# %player% подставляет ник. Задержка - в config.yml, protection.motd.
motd:
  lines:
    - "     &7Желаем приятной игры :)"
    - ""

title:
  login: "&fТребуется вход"
  login-sub: "&7/login <пароль>"
  register: "&fДобро пожаловать!"
  register-sub: "&7/register <пароль> <пароль>"
  welcome: "&fВход выполнен!"
  session: "&fСессия восстановлена"
  session-sub: "&7С возвращением - вход не потребовался"

