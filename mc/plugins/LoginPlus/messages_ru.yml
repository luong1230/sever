  usage: "&7Команды администратора:\n&f/loginplus reload &7- перезагрузить конфиг и сообщения\n&f/loginplus forcelogin <игрок> &7- принудительный вход игрока\n&f/loginplus unregister <игрок> &7- удалить аккаунт игрока\n&f/loginplus info <игрок> &7- показать данные аккаунта\n&f/loginplus 2fa reset <игрок> &7- сбросить 2FA игроку (потерян телефон / потерян secret.key)\n&f/loginplus import <authme|nlogin> &7- перенести аккаунты из другого плагина"
  2fa-usage: "&7Использование: &f/loginplus 2fa reset <игрок>"
