# Письма системы восстановления (обычный текст, без цветовых кодов!).
mail:
  confirm-subject: "[%server%] Подтвердите почту для восстановления"
  confirm-body: "Здравствуйте, %player%!\n\nВаш код подтверждения: %code%\n\nВведите его в игре командой /email confirm <код>, чтобы привязать этот адрес к вашему аккаунту Minecraft.\n\nЕсли вы не запрашивали это письмо, просто проигнорируйте его.\n\n%server%"
  recovery-subject: "[%server%] Код восстановления пароля"
  recovery-body: "Здравствуйте, %player%!\n\nВаш код восстановления пароля: %code%\n\nВведите в игре:\n/email recovery <код> <новыйПароль> <новыйПароль>\n\nЕсли вы не запрашивали восстановление, кто-то пытался получить доступ к вашему аккаунту - письмо можно проигнорировать, ваш пароль НЕ был изменён.\n\n%server%"

